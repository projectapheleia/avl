#
# Settings shared by every benchmark in this group - see ../common.mk for the
# meaning of each. Included by every signals_<n>/bench.conf, which sets nothing
# but its own signal count.

# One set of sources serves the whole group. The benchmarks differ only in how
# many of the signals the model carries they build fields for and drive.
BENCH_SOURCE_DIR := $(patsubst %/,%,$(dir $(BENCH_DIR)))

# What is being timed, in the singular - the word the report is written in.
BENCH_UNIT       := item

# Nothing here is randomized, so there is no spread of drawn values to measure.
BENCH_QUALITY    := 0

# How many signals to use, for the Python flavours and for the RTL respectively.
BENCH_ENV        += BENCH_SIGNALS=$(BENCH_SIGNALS)
BENCH_PLUSARGS   += +signals=$(BENCH_SIGNALS)

# Items per run. Both phases scale with it, so it does not change the ratio
# between them - what it buys is a measured difference far enough clear of the run
# to run variation of the baseline, which is a few percent of a second or so. The
# count therefore falls with the signal count, which is roughly what an item
# costs, to keep that difference at half a second or more throughout; the floor is
# where a wide item reaches it on its own.
ITERATIONS       ?= $(shell n=$$(( 160000 / $(BENCH_SIGNALS) )); \
                      [ $$n -lt 10000 ] && n=10000; echo $$n)

# SystemVerilog assigns to a signal in the same process that built the item,
# where the Python flavours cross into the simulator for every field, and it
# comes out two to three orders of magnitude cheaper per item. At the count above
# its cost would sit inside the run to run noise, so it runs a hundred times as
# many items - and bursts them, because one item is far cheaper than the 8 us an
# edge costs and the clock would otherwise be most of what its run measured.
# Everything the report compares is a time per item, so the counts need not match.
ITERATIONS_sv    ?= $(shell echo $$(( 100 * $(ITERATIONS) )))
BURST_sv         ?= 100
