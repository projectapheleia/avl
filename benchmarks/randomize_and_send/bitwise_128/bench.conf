# Per benchmark settings - see ../../common.mk for the meaning of each.

# A whole transaction is what is timed here: an item built, randomized and driven.
BENCH_UNIT     := transaction

# The variables the item carries, and the signals they are driven onto. Read by
# the testbenches, and by the RTL for its checker.
BENCH_SIGNALS  := 128
BENCH_ENV      += BENCH_SIGNALS=$(BENCH_SIGNALS)
BENCH_PLUSARGS += +signals=$(BENCH_SIGNALS)

# The spread of the values drawn is measured by randomization/bitwise, which
# constrains the same four shapes at the same width - 128 variables of them would
# add 384 rows to the report and say the same thing. What this benchmark is for is
# the time.
BENCH_QUALITY  := 0

# Transactions per run. An item of 128 constrained variables is three to four
# orders of magnitude dearer to solve than the four variable items of
# randomization/, so far fewer are needed to measure it - and it is dear enough
# that the clock cost per edge is not worth amortizing with a burst.
ITERATIONS     ?= 200
