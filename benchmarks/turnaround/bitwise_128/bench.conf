# Per benchmark settings - see ../../common.mk for the meaning of each.

# What is measured here is the wait, not the work: a build and run from nothing,
# then a build and run again after one line of the testbench has changed.
BENCH_PHASES     := turnaround

# One iteration is one of those - an edit, whatever it forces to be rebuilt, and
# the run that follows. The report is written in edits, not transactions.
BENCH_UNIT       := edit

# The testbench, the RTL and the item are randomize_and_send/bitwise_128's,
# used unchanged. This benchmark brings no sources of its own on purpose: what
# is being compiled here has to be a testbench the tree already reports the run
# time of, or the two figures could not be read against each other.
BENCH_SOURCE_DIR := $(BENCH_ROOT)/randomize_and_send/bitwise_128

# The width of that item, which the testbenches and the RTL checker both read.
# Matches its own bench.conf - the same testbench, built the same way.
BENCH_SIGNALS    := 128
BENCH_ENV        += BENCH_SIGNALS=$(BENCH_SIGNALS)
BENCH_PLUSARGS   += +signals=$(BENCH_SIGNALS)

# Transactions per run. The run has to be a real one - the model is elaborated,
# the test runs, and the RTL checks every value it receives - but it is not what
# is being measured here, so it is kept to the fewest that still exercise all of
# it. randomize_and_send/bitwise_128 is where the cost of a transaction is
# measured, at 200 of them.
ITERATIONS       ?= 5

# The spread of the values drawn is randomize_and_send/bitwise_128's business,
# and is measured there. Nothing about a build affects it.
BENCH_QUALITY    := 0

# Verilator compiles the model through an object cache where the environment
# provides one - "OBJCACHE ?= ccache" in its own makefile. Left alone, the first
# repeat of a cold build would fill that cache and the rest would be served from
# it, so a build "from nothing" would be measured as a cache hit and the figure
# would turn on the state of a directory outside this tree. It is disabled here
# so that a cold build compiles, every time and on every machine.
#
# The edit phase barely notices either way: make does not rebuild the objects
# whose sources did not change, and the one that did change is a miss in any
# cache. Put it back with "make OBJCACHE=ccache" to measure your own setup.
OBJCACHE         ?=
BENCH_ENV        += OBJCACHE=$(OBJCACHE)
